<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 4</title>
</head>
<body>
    <h1>Welcome to My Depi Assignment 1 - Task 4</h1>
    <form>
      <fieldset>
        <legend>Contact Information</legend>
        
        <div>
            <label for="fullname">Full Name:</label>
            <input 
                type="text" 
                id="fullname" 
                name="fullname" 
                required 
                aria-required="true"
                aria-describedby="fullname-help">
            <small id="fullname-help">Please enter your full name</small>
            <br><br>
        </div>

        <div>
            <label for="email">Email:</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              required
              pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
              aria-required="true"
              aria-describedby="emailHelp"
              aria-invalid="false"
            >
            <small id="emailHelp">Enter a valid email address.</small>
        
            <br><br>
        </div>
        
        <div>
            <label for="phone">Phone:</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone"
              required
              pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
              aria-required="true"
              aria-describedby="phone-help"
              aria-invalid="false"
            >
            <small id="phoneHelp">Enter your phone number.</small>
            
            <br><br>
        </div>

        <div>
            <label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob" 
            required
            aria-required="true"
            aria-invalid="false"
            >
            <br><br>
        </div>

        <div>  
            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>
            <br><br> 
        </div>
    
        <button type="submit">Submit</button>
      </fieldset>
    </form>

</body>
</html>
